<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Python-Flask Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .calculator {
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
        }
        .display {
            width: 100%;
            height: 50px;
            background-color: #fff;
            font-size: 24px;
            text-align: right;
            padding: 5px;
            box-sizing: border-box;
            margin-bottom: 15px;
            border: none;
            border-radius: 5px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            height: 50px;
            font-size: 20px;
            background-color: #e0e0e0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #d4d4d4; }
        button.operator { background-color: #ff9500; color: white; }
        button.operator:hover { background-color: #e08500; }
        button.clear { background-color: #ff3b30; color: white; }
        button.clear:hover { background-color: #d32f2f; }
    </style>
</head>
<body>

<div class="calculator">
    <label for="calc-screen" style="display: none;">Calculator Display</label>
    <!-- You can freely type here with your keyboard, and press Enter to calculate -->
    <input type="text" id="calc-screen" class="display" placeholder="0" onkeydown="if(event.key==='Enter') calculate()">

    <div class="grid">
        <button onclick="clearScreen()" class="clear">C</button>
        <button onclick="appendValue('/')" class="operator">/</button>
        <button onclick="appendValue('*')" class="operator">*</button>
        <button onclick="appendValue('-')" class="operator">-</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button onclick="appendValue('+')" class="operator" style="grid-row: span 2; height: 110px;">+</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="calculate()" class="operator" style="grid-row: span 2; height: 110px;">=</button>

        <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
        <button onclick="appendValue('.')">.</button>
    </div>
</div>

<script>
    const screen = document.getElementById('calc-screen');

    // Appends numbers or operators when onscreen buttons are clicked
    function appendValue(val) {
        screen.value += val;
    }

    // Clears the screen completely
    function clearScreen() {
        screen.value = '';
    }

    // Instantly evaluates the math string without lagging or reloading the page
    function calculate() {
        try {
            if (screen.value.trim() !== "") {
                screen.value = eval(screen.value);
            }
        } catch (error) {
            screen.value = "Error";
        }
    }
</script>
</body>
</html>
